name: Links Checker (@untitaker/hyperlink)

on:
  repository_dispatch:
  workflow_dispatch:

permissions: {}

jobs:
  linkChecker:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --engine-strict=false --allow-git=true

      - name: Build docs for hyperlink crawl target
        run: npm run docs

      - name: Run hyperlink and build report
        id: hyperlink
        run: |
          set +e
          npx -y @untitaker/hyperlink docs/ --check-anchors --github-actions 2>&1 | tee hyperlink-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          {
            echo '# Link Checker Report (@untitaker/hyperlink)'
            echo ''
            echo "- Exit code: ${exit_code}"
            echo '- Target: docs/'
            echo ''
            echo '```text'
            cat hyperlink-report.txt
            echo '```'
          } > hyperlink-out.md

          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Run lychee on Markdown/HTML/RST and build report
        id: markdown_links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          failIfEmpty: false
          output: markdown-links-out.md
          args: >-
            --verbose --no-progress './**/*.md' './**/*.html' './**/*.rst'
            --exclude-path '(^|/)\.git/'
            --exclude-path '(^|/)node_modules/'
            --exclude-path '(^|/)coverage/'
            --exclude-path '(^|/)\.nyc_output/'
            --exclude-path '(^|/)\.next/'
            --exclude-path '(^|/)\.nuxt/'
            --exclude-path '(^|/)\.serverless/'
            --exclude-path '(^|/)\.dynamodb/'
            --exclude-path '(^|/)\.fusebox/'
            --exclude-path '(^|/)\.cache/'
            --exclude-path '(^|/)bower_components/'
            --exclude-path '(^|/)jspm_packages/'
            --exclude-path '(^|/)typings/'
            --exclude-path '(^|/)\.grunt/'
            --exclude-path '(^|/)lib-cov/'
            --exclude-path '(^|/)build/Release/'
            --exclude-path '(^|/)\.npm/'
            --exclude-path '(^|/)\.vuepress/dist/'

      - name: Build combined report
        if: steps.hyperlink.outputs.exit_code != 0 || steps.markdown_links.outputs.exit_code != 0
        run: |
          {
            echo '# Link Checker Report (@untitaker/hyperlink + lychee)'
            echo ''
            echo "## Hyperlink (docs/)"
            echo ''
            if [ -f hyperlink-out.md ]; then
              cat hyperlink-out.md
            else
              echo 'No hyperlink report file was generated.'
            fi
            echo ''
            echo '---'
            echo ''
            echo "## Lychee (Markdown/HTML/RST)"
            echo ''
            if [ -f markdown-links-out.md ]; then
              cat markdown-links-out.md
            else
              echo 'No lychee report file was generated.'
            fi
          } > link-checkers-out.md

      - name: Create Issue From File
        if: steps.hyperlink.outputs.exit_code != 0 || steps.markdown_links.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report (@untitaker/hyperlink + lychee)
          content-filepath: ./link-checkers-out.md
          labels: report, automated issue

name: Links Checker (@untitaker/hyperlink)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  linkChecker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --engine-strict=false --allow-git=true

      - name: Build docs
        run: npm run docs

      - name: Check links and anchors
        uses: untitaker/hyperlink@0.3.2
        with:
          args: docs/ --check-anchors --sources .

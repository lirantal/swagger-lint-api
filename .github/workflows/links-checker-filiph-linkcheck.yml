name: Links Checker (filiph/linkcheck)

on:
  repository_dispatch:
  workflow_dispatch:

permissions: {}

jobs:
  linkChecker:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --engine-strict=false --allow-git=true

      - name: Build docs for local crawl target
        run: npm run docs

      - name: Run linkcheck and build report
        id: linkcheck
        run: |
          curl -fsSL -o linkcheck.tar.gz https://github.com/filiph/linkcheck/releases/download/3.0.0/linkcheck-3.0.0-linux-x64.tar.gz
          echo '817629c7077cea9bef4b9d66d5b8d029575e103da3fea9c49d55b45083a8e786  linkcheck.tar.gz' | sha256sum -c -
          tar -xzf linkcheck.tar.gz
          chmod +x linkcheck

          python3 -m http.server 8080 --directory . >/tmp/filiph-linkcheck-http.log 2>&1 &
          http_server_pid=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/docs/ >/dev/null; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              kill "$http_server_pid"
              echo 'Local docs server did not become ready in time.'
              exit 1
            fi
            sleep 1
          done

          set +e
          ./linkcheck http://127.0.0.1:8080/docs/ -e 2>&1 | tee linkcheck-report.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          kill "$http_server_pid"

          {
            echo '# Link Checker Report (filiph/linkcheck)'
            echo ''
            echo "- Exit code: ${exit_code}"
            echo '- Target: http://127.0.0.1:8080/docs/'
            echo ''
            echo '```text'
            cat linkcheck-report.txt
            echo '```'
          } > linkcheck-out.md

          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Create Issue From File
        if: steps.linkcheck.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report (filiph/linkcheck)
          content-filepath: ./linkcheck-out.md
          labels: report, automated issue
